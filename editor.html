<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="painel-token" content="__PAINEL_TOKEN__">
<title>Editor · Red Code</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/monaco/editor/editor.main.css">
<style>
:root { --papel: #141011; --folha: #1d1617; --realce: #271d1f; --linha: #4b3437; --tinta: #f3e9e8; --grafite: #b4a1a2; --voce: #e8483d; --erro: #ff8f80; --mono: "Cascadia Mono", Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--papel); color: var(--tinta); font: 13px "Segoe UI", system-ui, sans-serif; }
body { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
/* Embutido no ao vivo da janela principal: só o código; abas, trilha e barra de status são as do ao vivo */
body.embutido { grid-template-columns: 1fr; grid-template-rows: 1fr; background: #1f1f1f; }
body.embutido[data-tema="claro"] { background: #ffffff; color-scheme: light; }
body.embutido :is(.arvore, .abas, .barra-acoes, .status, #vazio) { display: none !important; }
/* Animação da edição do Claude: o que sai fica vermelho, o que entra fica verde (as cores do ao vivo) */
.dec-sai { background: #f851491f; }
.dec-sai-margem { border-left: 3px solid #f85149; margin-left: 3px; }
.dec-entra { background: #3fb95014; }
.dec-entra-margem { border-left: 3px solid #3fb950; margin-left: 3px; }
body.embutido[data-tema="claro"] .aviso { background: #fff4e0; color: #8a5300; }
body.embutido[data-tema="claro"] .problemas { background: #ffffff; border-top-color: #e5e5e5; }
body.embutido[data-tema="claro"] .problemas button { color: #c4312a; }
.arvore { grid-row: 1 / 3; border-right: 1px solid var(--linha); overflow: auto; padding: 8px 0; }
.arvore .raiz { padding: 4px 12px 8px; font-weight: 600; color: var(--voce); word-break: break-all; }
.no { display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.no:hover { background: var(--folha); }
.no.atual { background: var(--realce); color: var(--voce); }
.no .seta { width: 12px; color: var(--grafite); flex: none; }
.filhos { padding-left: 12px; }
.principal { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.abas { display: flex; overflow-x: auto; border-bottom: 1px solid var(--linha); background: var(--folha); min-height: 34px; }
.aba { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 12px; border-right: 1px solid var(--linha); white-space: nowrap; color: var(--grafite); }
.aba.ativa { background: var(--papel); color: var(--tinta); box-shadow: inset 0 2px 0 var(--voce); }
.aba .sujo { width: 8px; height: 8px; border-radius: 50%; background: var(--voce); }
.aba .trava { font-size: 11px; }
.aba .fechar { color: var(--grafite); padding: 0 2px; }
.aba .fechar:hover { color: var(--tinta); }
.barra-acoes { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--linha); }
.barra-acoes .mini { padding: 3px 9px; border: 1px solid var(--linha); border-radius: 7px; font-size: 12px; }
.barra-acoes .mini:hover { border-color: var(--voce); color: var(--voce); }
.barra-acoes .espaco { flex: 1; }
.aviso { padding: 6px 12px; background: #33261a; color: #f0b264; border-bottom: 1px solid var(--linha); display: flex; gap: 10px; align-items: center; }
.aviso button { border: 1px solid #f0b264; border-radius: 6px; padding: 1px 8px; }
#editor { flex: 1; min-height: 0; min-width: 0; }
/* Visualização de Markdown (estilo da prévia do VS Code, tema escuro) */
.area { flex: 1; min-height: 0; display: flex; }
.area[data-modo="previa"] #editor.escondido-md { display: none; }
.area[data-modo="lado"] #editor, .area[data-modo="lado"] .previa-md { flex: 1 1 50%; }
.area[data-modo="previa"] .previa-md { flex: 1; }
.barra-acoes .mini[aria-pressed="true"] { border-color: var(--voce); color: var(--voce); background: #2a1c1d; }
.previa-md { min-width: 0; overflow: auto; border-left: 1px solid var(--linha); background: #1e1e1e; color: #cccccc; animation: mdEntra .2s ease both; }
@keyframes mdEntra { from { opacity: 0; } }
.md { max-width: 880px; margin: 0 auto; padding: 22px 32px 60px; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, sans-serif; word-wrap: break-word; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { color: #e7e7e7; font-weight: 600; line-height: 1.25; margin: 24px 0 16px; }
.md h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid rgba(255, 255, 255, .18); }
.md h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid rgba(255, 255, 255, .18); }
.md h3 { font-size: 1.25em; } .md h4 { font-size: 1em; } .md h5 { font-size: .875em; } .md h6 { font-size: .85em; color: #a0a0a0; }
.md p, .md ul, .md ol, .md blockquote, .md table, .md pre { margin: 0 0 16px; }
.md a { color: #3794ff; text-decoration: none; } .md a:hover { text-decoration: underline; }
.md code { font-family: var(--mono); font-size: .9em; padding: .15em .35em; border-radius: 4px; background: rgba(255, 255, 255, .08); color: #d7ba7d; }
.md pre { padding: 14px 16px; border-radius: 6px; background: #252526; overflow: auto; line-height: 1.45; }
.md pre code { padding: 0; background: none; color: #d4d4d4; font-size: 13px; }
.md blockquote { margin-left: 0; padding: 0 1em; border-left: 4px solid rgba(255, 255, 255, .2); color: #a8a8a8; }
.md ul, .md ol { padding-left: 2em; } .md li + li { margin-top: .25em; }
.md li > input[type="checkbox"] { margin: 0 .4em .2em -1.3em; vertical-align: middle; }
.md li:has(> input[type="checkbox"]) { list-style: none; }
.md table { border-collapse: collapse; display: block; overflow: auto; }
.md th, .md td { border: 1px solid rgba(255, 255, 255, .18); padding: 6px 13px; }
.md th { font-weight: 600; background: rgba(255, 255, 255, .04); }
.md tr:nth-child(2n) td { background: rgba(255, 255, 255, .025); }
.md hr { height: 1px; border: 0; background: rgba(255, 255, 255, .18); margin: 24px 0; }
.md img { max-width: 100%; border-radius: 4px; }
.md kbd { font: 11px var(--mono); padding: 2px 5px; border: 1px solid rgba(255, 255, 255, .25); border-bottom-width: 2px; border-radius: 4px; }
.vazio { flex: 1; display: grid; place-items: center; color: var(--grafite); }
.problemas { max-height: 120px; overflow: auto; border-top: 1px solid var(--linha); font-size: 12px; }
.problemas button { display: block; width: 100%; text-align: left; padding: 3px 12px; color: var(--erro); }
.problemas button:hover { background: var(--folha); }
.status { grid-column: 2; display: flex; gap: 16px; align-items: center; padding: 3px 12px; border-top: 1px solid var(--linha); background: var(--folha); font-size: 12px; color: var(--grafite); }
.status select { background: var(--papel); color: var(--tinta); border: 1px solid var(--linha); border-radius: 5px; font: inherit; }
.status .espaco { flex: 1; }
.busca { position: fixed; top: 60px; left: 50%; translate: -50% 0; width: min(560px, 90vw); background: var(--realce); border: 1px solid var(--linha); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.4); padding: 6px; z-index: 50; }
.busca input { width: 100%; padding: 8px; background: var(--papel); color: var(--tinta); border: 1px solid var(--linha); border-radius: 6px; font: inherit; }
.busca .resultado { display: block; width: 100%; text-align: left; padding: 5px 8px; border-radius: 5px; font-family: var(--mono); font-size: 12px; }
.busca .resultado[aria-selected="true"], .busca .resultado:hover { background: var(--folha); color: var(--voce); }
.recado { position: fixed; bottom: 36px; right: 16px; background: var(--realce); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.recado.visivel { opacity: 1; }
</style>
</head>
<body>
<nav class="arvore" id="arvore" aria-label="Arquivos do projeto"></nav>
<section class="principal">
    <div class="abas" id="abas" role="tablist"></div>
    <div class="barra-acoes">
        <button class="mini" id="btnSalvar" title="Ctrl + S">Salvar</button>
        <button class="mini" id="btnPerguntar" title="Ctrl + Alt + K: manda a seleção para a conversa">Perguntar ao Claude sobre a seleção</button>
        <button class="mini" id="btnBusca" title="Ctrl + P">Abrir arquivo…</button>
        <button class="mini" id="btnMdLado" title="Ctrl + K, V: o Markdown visualizado ao lado do código" aria-pressed="false" hidden>Visualizar ao lado</button>
        <button class="mini" id="btnMdSo" title="Ctrl + Shift + V: só a visualização do Markdown" aria-pressed="false" hidden>Só visualização</button>
        <span class="espaco"></span>
        <button class="mini" id="btnVscode" title="Abrir este arquivo no VS Code">Abrir no VS Code</button>
    </div>
    <div class="aviso" id="aviso" hidden></div>
    <div class="area" id="area" data-modo="codigo"><div id="editor" hidden></div><div class="previa-md" id="previa" hidden></div></div>
    <div class="vazio" id="vazio">Escolha um arquivo à esquerda ou use Ctrl + P.</div>
    <div class="problemas" id="problemas" hidden></div>
</section>
<footer class="status" id="status">
    <span id="stCaminho"></span>
    <span class="espaco"></span>
    <span id="stPosicao"></span>
    <label>Codificação <select id="stCodificacao"><option value="utf8">UTF-8</option><option value="windows-1252">Windows-1252 (Latin-1)</option></select></label>
    <span id="stEol"></span>
</footer>
<div class="busca" id="busca" hidden><input id="buscaCampo" placeholder="Nome do arquivo" autocomplete="off"><div id="buscaLista"></div></div>
<div class="recado" id="recado" role="status" aria-live="polite"></div>
<!-- marked e DOMPurify antes do loader do Monaco: depois dele, viram módulo AMD e não global -->
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/vendor/monaco/loader.js"></script>
<script src="/editor.js"></script>
<script src="/editor-md.js"></script>
</body>
</html>
