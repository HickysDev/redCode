<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>V&iacute;deo &middot; Red Code</title>
<style>
/* Video desanexado: janela sem moldura, sempre por cima (o Red Code abre assim pelo botao do quadrinho do canto) */
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #f3eee9; font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
.clipe-tela { position: absolute; inset: 0; overflow: hidden; }
.clipe-tela iframe, .clipe-tela video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; background: #000; pointer-events: none; }
.clipe-aviso { position: absolute; inset: 0; display: grid; place-items: center; padding: 34px 18px 14px; text-align: center; color: #c9beb5; background: #000c; overflow-wrap: anywhere; }
.clipe-aviso .mini { margin-left: 6px; padding: 2px 8px; border: 1px solid #fff6; border-radius: 6px; background: transparent; color: #fff; cursor: pointer; -webkit-app-region: no-drag; }
/* Pet de carregando (igual ao dos agentes do Red Code) */
/* Pet de carregando comendo pipoca: mastiga, balde listrado do lado e graos voando do balde ate a boca */
.pet-video .pet-corpo { animation: petMastiga .6s ease-in-out infinite; }
.pet-video .pet-boca { position: absolute; left: 50%; bottom: 6px; width: 8px; height: 4px; margin-left: -4px; border-radius: 0 0 5px 5px; background: #1b1b1b; animation: petBoca .6s ease-in-out infinite; }
.pet-video .pet-balde { position: absolute; right: -17px; bottom: -3px; animation: petBalde 1.8s ease-in-out infinite; }
.pet-video .pet-grao { position: absolute; right: -11px; top: 2px; width: 5px; height: 5px; border-radius: 50%; background: #fff8e2; box-shadow: 1px 1px 0 #f0c96a inset; opacity: 0; animation: petGrao 1.8s ease-in infinite; }
.pet-video .pet-grao.g2 { animation-delay: .6s; }
.pet-video .pet-grao.g3 { animation-delay: 1.2s; }
@keyframes petMastiga { 0%, 100% { transform: scale(1.05, .95); } 50% { transform: scale(.97, 1.04) translateY(-2px); } }
@keyframes petBoca { 0%, 100% { height: 4px; } 50% { height: 1.5px; } }
@keyframes petBalde { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
@keyframes petGrao { 0% { opacity: 0; transform: translate(0, 0) scale(.7); } 15% { opacity: 1; transform: translate(-4px, -12px) scale(1); } 60% { opacity: 1; transform: translate(-17px, -6px); } 75%, 100% { opacity: 0; transform: translate(-21px, 8px) scale(.6); } }
.clipe-carregando .clipe-aviso { padding: 10px; background: #000; }
.pet { position: relative; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #d8cfc7; }
.pet-corpo { position: relative; width: 34px; height: 28px; border-radius: 16px 16px 10px 10px; background: var(--cor-pet, #e8483d); animation: petPula 1.1s ease-in-out infinite; box-shadow: inset 0 -5px 0 #0002; }
.pet-corpo::before, .pet-corpo::after { content: ""; position: absolute; top: 9px; width: 5px; height: 7px; border-radius: 3px; background: #1b1b1b; animation: petPisca 3.2s infinite; }
.pet-corpo::before { left: 9px; } .pet-corpo::after { right: 9px; }
.pet-item { position: absolute; right: -11px; top: -10px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: #1a1516; border: 1px solid #fff3; color: var(--cor-pet); animation: petBalanca 1.1s ease-in-out infinite; }
.pet-sombra { width: 26px; height: 5px; margin-top: 3px; border-radius: 50%; background: #fff2; animation: petSombra 1.1s ease-in-out infinite; }
.pet-nome { margin-top: 5px; font-weight: 600; }
.pet-faz::after { content: ""; animation: petPontos 1.5s steps(4) infinite; }
@keyframes petPula { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 15% { transform: none; } 50% { transform: translateY(-12px) scale(.96, 1.05); } 85% { transform: none; } }
@keyframes petSombra { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.6); opacity: .4; } }
@keyframes petBalanca { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg) translateY(-12px); } }
@keyframes petPisca { 0%, 92%, 100% { height: 7px; top: 9px; } 95% { height: 1px; top: 12px; } }
@keyframes petPontos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.clipe-procurando .clipe-aviso { top: auto; padding: 16px 10px 7px; font-size: 11px; background: linear-gradient(#0000, #000b); }
.barra { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 2px; padding: 6px 6px 18px 10px; background: linear-gradient(#000d, #0000); opacity: 0; transition: opacity .2s; -webkit-app-region: drag; }
body:hover .barra, body.pairando .barra, body.clipe-com-aviso .barra { opacity: 1; }
.barra .nome { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
.barra button { -webkit-app-region: no-drag; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #fff; cursor: pointer; }
.barra button:hover { background: #ffffff2b; }
/* Arrastar a janela por qualquer ponto (o video nao recebe clique) */
.arrasta { position: absolute; inset: 0; -webkit-app-region: drag; }
</style>
</head>
<body>
<div class="clipe-tela"></div>
<div class="arrasta"></div>
<div class="clipe-aviso" hidden></div>
<div class="barra">
    <span class="nome" id="nome"></span>
    <button type="button" id="anexar" title="Voltar para o canto do Red Code" aria-label="Voltar para o canto do Red Code"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.6"/><rect x="2.8" y="8.6" width="5.6" height="3.6" rx=".8" fill="currentColor" stroke="none"/></svg></button>
    <button type="button" id="fechar" title="Fechar o v&iacute;deo" aria-label="Fechar o v&iacute;deo"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<script src="/clipe.js"></script>
<script>
// Fala com a janela principal pelo BroadcastChannel: "anexar" volta o video para o canto do Red Code
const canal = new BroadcastChannel('redcode-clipe');
const nome = document.getElementById('nome');
const clipe = ClipeMusica(document.body, {
    aoEstado: (estado) => document.body.classList.toggle('clipe-com-aviso', !!estado && estado !== 'carregando'),
    aoProporcao: (r) => { if (window.painelDesktop && window.painelDesktop.clipe) window.painelDesktop.clipe.proporcao(r); },
    aoTrocar: (v) => { nome.textContent = v.titulo || ''; },
});
document.getElementById('anexar').addEventListener('click', () => { canal.postMessage({ tipo: 'anexar' }); window.close(); });
document.getElementById('fechar').addEventListener('click', () => { canal.postMessage({ tipo: 'fechar' }); window.close(); });
canal.addEventListener('message', (ev) => { if (ev.data && ev.data.tipo === 'fecha-janela') window.close(); });
if (window.painelDesktop && window.painelDesktop.clipe && window.painelDesktop.clipe.aoPairar) window.painelDesktop.clipe.aoPairar((dentro) => document.body.classList.toggle('pairando', dentro));
canal.postMessage({ tipo: 'desanexou' });
</script>
</body>
</html>
